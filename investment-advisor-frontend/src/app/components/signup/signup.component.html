<div class="auth-page">

  <div class="auth-card">

    <div class="auth-header">

      <h1>Create Account</h1>

      <p>
        Create your account to get personalized investment advice.
      </p>

    </div>


    <form (ngSubmit)="signup()">

      <div class="form-group">

        <label for="name">
          Name
        </label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
          autocomplete="name"
          required
        />

      </div>


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Minimum 8 characters"
          autocomplete="new-password"
          required
        />

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm your password"
          autocomplete="new-password"
          required
        />

      </div>


      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>


      <button
        type="submit"
        class="auth-button"
        [disabled]="isLoading"
      >

        <span *ngIf="!isLoading">
          Create Account
        </span>

        <span *ngIf="isLoading">
          Creating Account...
        </span>

      </button>

    </form>


    <div class="divider">
      <span>ALREADY HAVE AN ACCOUNT?</span>
    </div>


    <button
      type="button"
      class="secondary-button"
      (click)="goToLogin()"
    >
      Login
    </button>


    <button
      type="button"
      class="back-button"
      (click)="goToDashboard()"
    >
      ← Back to Dashboard
    </button>

  </div>

</div>
